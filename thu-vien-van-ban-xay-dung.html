<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>Thư Viện Văn Bản Xây Dựng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
:root{
  --bg:#f5f6f3; --surface:#ffffff; --sunk:#eceee9; --line:#d9ddd5; --fg:#1d2420; --muted:#5d6760;
  --accent:#2b4c7e; --accent-soft:#e3e9f3; --mark:#fbe7a6;
  --ok:#2e7d4f; --ok-soft:#e1f1e6; --warn:#9a6200; --warn-soft:#fbefd6; --bad:#b23a32; --bad-soft:#f8e1de;
  --violet:#6a4c93; --violet-soft:#ece5f5;
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-read:"Literata","Noto Serif",Georgia,serif;
  --r:8px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141816; --surface:#1c211e; --sunk:#232925; --line:#333b36; --fg:#e6ebe7; --muted:#9aa49d;
  --accent:#8fb0e6; --accent-soft:#25324a; --mark:#6b5715;
  --ok:#7fcf9c; --ok-soft:#1d3427; --warn:#e8b65c; --warn-soft:#3a2f17; --bad:#f08f86; --bad-soft:#3f2220;
  --violet:#c4aee8; --violet-soft:#2e2440; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141816; --surface:#1c211e; --sunk:#232925; --line:#333b36; --fg:#e6ebe7; --muted:#9aa49d;
  --accent:#8fb0e6; --accent-soft:#25324a; --mark:#6b5715;
  --ok:#7fcf9c; --ok-soft:#1d3427; --warn:#e8b65c; --warn-soft:#3a2f17; --bad:#f08f86; --bad-soft:#3f2220;
  --violet:#c4aee8; --violet-soft:#2e2440; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:9px}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:999px;overflow-x:auto;max-width:100%;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{padding:6px 14px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-weight:500;font-size:14px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0/.12);font-weight:600}
.top .spacer{flex:1}
.toplinks{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.toplinks a,.iconbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);text-decoration:none;font-size:13px;font-weight:500}
.toplinks a:hover,.iconbtn:hover{border-color:var(--accent)}
main{padding-block:20px 56px}
h1{font-size:26px;line-height:1.25;margin:0 0 6px;letter-spacing:-.01em;font-weight:800}
h2{font-size:19px;margin:0 0 4px;font-weight:700}
h3{font-size:15.5px;margin:0 0 8px;font-weight:700}
.lede{color:var(--muted);max-width:72ch;margin:0}
.note{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px;margin:18px 0 22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:12.5px;color:var(--muted)}
.search-head{display:flex;gap:14px 24px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.search-head .head-text{flex:1 1 420px;min-width:0}
.stats-single{display:flex;justify-content:flex-end;margin-left:auto;flex:0 0 auto;align-items:center}
.stats-single .stat{display:flex;align-items:baseline;gap:8px;padding:8px 14px;white-space:nowrap}
.stats-single .stat b{display:inline;font-size:22px;line-height:1}
.stats-single .stat span{font-size:13px;white-space:nowrap}
.fgroup{margin-top:12px}
.fgroup .flabel{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.fgroup .filters{margin-top:6px}
.sortrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sortrow label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--muted);flex:0 1 260px;max-width:260px;width:100%}
.sortrow select{padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:14px;font-weight:400;color:var(--fg);width:100%}
.panel[hidden]{display:none}
#libDotBar[hidden]{display:none}
.searchbar{display:flex;gap:8px;flex-wrap:wrap}
.searchbar input[type=search]{flex:1 1 300px;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:16px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:var(--r);font-weight:500;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#10151f}}
:root[data-theme="dark"] .btn.primary{color:#10151f}
.btn:hover{border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);padding:4px 11px;border-radius:999px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg);font-weight:600}
.filters .sep{width:1px;height:18px;background:var(--line);margin-inline:4px}
.selfilters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.selfilters label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--muted);flex:1 1 150px;max-width:260px}
.selfilters select{padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:14px;font-weight:400;color:var(--fg);width:100%}
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;margin-top:16px;align-items:start}
.results{display:flex;flex-direction:column;gap:8px;min-width:0}
.rescount{font-size:13px;color:var(--muted);margin:2px 0 2px}
.res{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px}
.res:hover{border-color:var(--accent)}
.res[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.res .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.res .so{font-weight:700;font-variant-numeric:tabular-nums}
.res .ten{display:block;font-weight:600;margin-top:3px;line-height:1.4;overflow-wrap:anywhere}
.res .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.tag{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.vio{background:var(--violet-soft);color:var(--violet)}
.tag.draft{background:var(--sunk);color:var(--muted);border:1px dashed var(--line)}
.tag.grey{background:var(--sunk);color:#9aa49d}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;position:sticky;top:64px}
@media (min-width:901px){
  .detail{max-height:calc(100vh - 84px);max-height:calc(100dvh - 84px);overflow-y:auto;scrollbar-gutter:stable}
}
.detail .dso{font-size:13px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.detail h2{font-family:var(--f-read);font-size:20px;line-height:1.4;margin:4px 0 10px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 16px;margin:12px 0}
.kv div{min-width:0}
.kv dt{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kv dd{margin:2px 0 0;font-size:14px;overflow-wrap:anywhere}
.ghichu{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:13.5px;margin:10px 0;overflow-wrap:anywhere}
.dsec{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.filecard{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px;background:var(--bg)}
.filecard .fname{font-weight:600;font-size:13.5px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.filecard .fmeta{font-size:12.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.filecard .facts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sha{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;overflow-wrap:anywhere;color:var(--muted)}
.relrow,.srcrow{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 2px;font-size:13.5px}
.relrow{cursor:pointer}
.relrow:hover .rt{color:var(--accent)}
.relrow:last-child,.srcrow:last-child{border-bottom:0}
.relrow .rt{font-weight:600;overflow-wrap:anywhere}
.relrow .rm,.srcrow .rm{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.srcrow a{overflow-wrap:anywhere}
.empty{padding:28px 20px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.libgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:14px 0 20px}
.libcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;color:var(--fg);display:block;min-width:0}
.libcard b{display:block;font-size:13.5px;line-height:1.35;overflow-wrap:anywhere}
.libcard .n{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:6px;line-height:1.15}
.libcard .n small{font-size:12px;font-weight:500;color:var(--muted)}
.libtable{font-size:12.5px;table-layout:fixed}
.libtable th,.libtable td{padding:6px 8px}
.libtable th{font-size:10.5px;letter-spacing:.03em;white-space:normal;line-height:1.3;text-align:center;vertical-align:middle}
.libtable td{overflow-wrap:break-word;vertical-align:top;text-align:left}
.libtable td:nth-child(8),.libtable td:nth-child(9),.libtable td:nth-child(10){text-align:center}
.libtable .tag{white-space:normal;line-height:1.3;text-align:left}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--sunk);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--accent-soft)}
tr:last-child td{border-bottom:0}
td .so{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.libtable td .so{white-space:normal}
.so-top,.so-bot{display:block;line-height:1.35}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.mcards{display:none}
.mcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;margin-bottom:8px}
.nkitem{padding:10px 0;border-bottom:1px solid var(--line)}
.nkitem:last-child{border-bottom:0}
.nkitem .nh{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.nkitem p{margin:5px 0 0;font-size:13.5px;overflow-wrap:anywhere}
.nkdocs{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.nkchip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.nkchip:hover{border-color:var(--accent)}
.news-filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.news-list{display:flex;flex-direction:column;gap:14px;max-width:900px}
.news-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.news-card.imp{border:1.5px solid var(--bad)}
.news-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.news-imp{background:var(--bad);color:#fff;font-weight:700;font-size:11.5px;letter-spacing:.04em;padding:2px 9px;border-radius:4px;white-space:nowrap}
@media (prefers-color-scheme:dark){.news-imp{color:#221210}}
:root[data-theme="dark"] .news-imp{color:#221210}
.news-type{background:var(--sunk);color:var(--fg);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:500;white-space:nowrap}
.news-so{font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.news-card h3{font-size:18px;line-height:1.35;margin:9px 0 4px;font-weight:700;overflow-wrap:anywhere}
.news-meta{font-size:13.5px;color:var(--muted);margin:0}
.news-sum{margin:8px 0 0;font-size:14.5px;overflow-wrap:anywhere}
.news-points{margin-top:10px}
.news-points summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent);padding:2px 0}
.news-points ul{margin:6px 0 2px;padding-left:20px}
.news-points li{margin:4px 0;font-size:14px;overflow-wrap:anywhere}
.news-note{margin:10px 0 0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.news-src{margin:5px 0 0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.news-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.news-actions .btn{text-decoration:none;display:inline-block}
footer{border-top:1px solid var(--line);background:var(--surface);padding:18px 0 28px;font-size:13px;color:var(--muted)}
footer .wrap{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (max-width:900px){
  .split{grid-template-columns:1fr}
  .detail{position:static}
  .libgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  h1{font-size:22px}
  @media (max-width:480px){.libgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .tablewrap{display:none}
  .mcards{display:block}
}
@media print{
  header.top,footer,.searchbar,.filters,.selfilters,.toplinks{display:none!important}
  body{background:#fff}
  .detail{position:static;max-height:none;overflow:visible}
  .split{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <nav class="tabs" role="tablist" aria-label="Mục chính">
      <button role="tab" id="tabbtn-search" aria-selected="true" data-tab="search">Tra cứu</button>
      <button role="tab" id="tabbtn-update" aria-selected="false" data-tab="update">Cập nhật</button>
      <button role="tab" id="tabbtn-lib" aria-selected="false" data-tab="lib">Kho văn bản</button>
    </nav>
    <div class="spacer"></div>
    <div class="toplinks">
      <button class="iconbtn" id="themeBtn" type="button" aria-label="Đổi giao diện sáng / tối">◐ Sáng / tối</button>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- ============ TRA CỨU ============ -->
  <section class="panel" id="panel-search" role="tabpanel" aria-labelledby="tabbtn-search">
    <div class="search-head">
      <div class="head-text">
        <h1>Thư viện văn bản xây dựng</h1>
      </div>
      <div class="stats-single" id="statsStrip"></div>
    </div>

    <form class="searchbar" id="searchForm">
      <input type="search" id="q" placeholder="Tìm theo số hiệu, tên, từ khóa — gõ một phần của từ cũng được… Ví dụ: qc, QCVN 06, Luật Kiến trúc, 85/2020" aria-label="Từ khóa tìm kiếm" autocomplete="off">
      <button class="btn primary" type="submit">Tìm</button>
      <button class="btn" type="button" id="clearBtn">Xóa lọc</button>
    </form>
    <div class="filters" id="lvChips" aria-label="Lọc theo lĩnh vực"></div>
    <div class="selfilters">
      <label>Loại văn bản
        <select id="fLoai" aria-label="Lọc theo loại văn bản"></select>
      </label>
      <label>Cơ quan ban hành
        <select id="fCoquan" aria-label="Lọc theo cơ quan ban hành"></select>
      </label>
      <label>Nhóm hiệu lực
        <select id="fStatus" aria-label="Lọc theo nhóm hiệu lực"></select>
      </label>
      <label>Sắp xếp
        <select id="fSort">
          <option value="rel">Liên quan nhất</option>
          <option value="new">Ngày ban hành mới nhất</option>
          <option value="eff">Ngày hiệu lực mới nhất</option>
          <option value="so">Số hiệu A–Z</option>
        </select>
      </label>
    </div>

    <div class="split">
      <div>
        <p class="rescount" id="resCount"></p>
        <div class="results" id="results"></div>
      </div>
      <article class="detail" id="detail" aria-live="polite"></article>
    </div>
  </section>

  <!-- ============ KHO VĂN BẢN ============ -->
  <section class="panel" id="panel-lib" role="tabpanel" aria-labelledby="tabbtn-lib" hidden>
    <h2 style="font-size:22px">Kho văn bản</h2>
    <div class="libgrid" id="libGrid"></div>
    <p class="rescount" id="libCount"></p>
    <div class="filters" id="libDotBar" hidden style="margin:0 0 10px">
      <span class="note" id="libDotLabel"></span>
      <button type="button" class="chip" id="libDotClear">Bỏ lọc theo đợt</button>
    </div>
    <div class="tablewrap">
      <table class="libtable">
        <colgroup><col style="width:13.75%"><col style="width:7%"><col style="width:20.15%"><col style="width:12%"><col style="width:8.5%"><col style="width:8.5%"><col style="width:9.1%"><col style="width:11%"><col style="width:4%"><col style="width:6%"></colgroup>
        <thead><tr><th>Số hiệu</th><th>Loại</th><th>Tên văn bản</th><th>Cơ quan</th><th>Ban hành</th><th>Hiệu lực</th><th>Lĩnh vực</th><th>Tình trạng</th><th>Tệp</th><th>Thư mục Drive</th></tr></thead>
        <tbody id="libBody"></tbody>
      </table>
    </div>
    <div class="mcards" id="libCards"></div>
  </section>

  <!-- ============ CẬP NHẬT ============ -->
  <section class="panel" id="panel-update" role="tabpanel" aria-labelledby="tabbtn-update" hidden>
    <h2 style="font-size:22px">Tin văn bản mới</h2>
    <div class="news-filters" role="group" aria-label="Lọc tin văn bản mới">
      <span id="newsTypeChips" style="display:contents"></span>
      <button type="button" class="chip" id="newsImpChip" aria-pressed="false">Tin quan trọng</button>
    </div>
    <div class="news-list" id="newsList" style="margin-top:14px"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>Dữ liệu đóng gói tại thời điểm 11/11/2026.</span>
  </div>

 danh", "VB-xxxxxx: một hồ sơ cho mỗi định danh; QCVN/TCVN và văn bản ban hành có hồ sơ riêng. Một file có thể liên kết nhiều hồ sơ."], ["Tên file", "[Loai]_[So-hieu-an-toan]__[Ten-ngan]__[Vai-tro-file].[duoi-file]. Thay / và : bằng -. Giữ số hiệu nguyên văn trong danh mục."], ["File gốc", "Giữ nguyên byte file tải về. OCR/tóm tắt là bản dẫn xuất, không thay thế bản gốc. Không xóa bản lịch sử."], ["Chống trùng", "So định danh hồ sơ (loại, số, cơ quan, ngày, phiên bản); so SHA-256 ở cấp file."], ["Hiệu lực", "Tách tình trạng hiệu lực, mức xác minh và mức đủ file. Kiểm tra sửa đổi, thay thế, bãi bỏ, phạm vi tác động và chuyển tiếp; có mâu thuẫn thì đưa hàng chờ."], ["Tiêu chuẩn", "Nếu chưa có toàn văn được phép tiếp cận, chỉ lưu metadata và nguồn tiếp cận; không ghi đã thu thập toàn văn."], ["Hoàn thành file", "Kiểm PDF, nhận diện/thành phần, SHA-256; sau upload đọc lại metadata và xác nhận file xuất hiện trong thư mục. Kiểm trashed khi công cụ trả trường này; không suy ra còn trong kho chỉ từ việc đọc được ID."], ["Trạng thái hồ sơ", "Ứng viên; Đã xác minh định danh; Chờ xác minh hiệu lực; Đã rà soát hiệu lực tại ngày kiểm tra."], ["Mức đủ file", "Chưa có toàn văn; Có toàn văn - chờ kiểm tra đầy đủ; Đã kiểm tra thành phần."], ["Quan hệ", "Ban hành kèm theo; Sửa đổi/bổ sung; Thay thế; Bãi bỏ; Hướng dẫn; Hợp nhất; Dẫn chiếu. Ghi căn cứ và phạm vi."], ["Tiếp tục phiên sau", "Đọc 00_HUONG_DAN → BAO_CAO_KIEM_TRA_CHEO_<ngày>.md trong CHUYEN_GIAO_CHATGPT → 09_KIEM_TRA_CHEO → 01_DANH_MUC,05_CHO_XU_LY,06_NHAT_KY. Nếu không có báo cáo hôm nay dùng bản gần nhất và ghi nhật ký; bản sơ bộ đọc lại lúc 7:30."], ["Lịch chạy", "Đã tạo và bật tác vụ định kỳ lúc07:15 hằng ngày,giờViệt Nam(Asia/Ho_Chi_Minh),theo câu lệnh người dùng gửi10/11/2026: đọc báo cáo kiểm tra chéo,xử lý lỗi trước,thu thập tối đa20 mục Chờ xử lý,cập nhật dữ liệu và báo cáo5dòng. Lịch đầu10/11/2026 lúc07:15."], ["Drive gốc", "https://drive.google.com/drive/folders/1gQwfQDKWoFVF_pCB8_a9KMLALPXeWgr5"], ["Cấu trúc th <script>
(function(){
"use strict";
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function stripDia(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D");}
function norm(s){return stripDia(String(s||"").toLowerCase()).replace(/\s+/g," ").trim();}
function fmtDate(s){if(!s)return "—";var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);return m?m[3]+"/"+m[2]+"/"+m[1]:s;}
function fmtBytes(b){var n=parseInt(b,10);if(!n&&n!==0)return "";if(isNaN(n))return b;if(n>=1048576)return (n/1048576).toFixed(1).replace(".",",")+" MB";if(n>=1024)return Math.round(n/1024)+" KB";return n+" byte";}
function splitMulti(s){return String(s||"").split(";").map(function(x){return x.trim();}).filter(Boolean);}
function isUrl(s){return /^https?:\/\//i.test(String(s||"").trim());}

/* ---- Build records ---- */
var VB = (DATA.dm||[]).map(function(r){
  return {ma:r[0]||"",so:r[1]||"",loai:r[2]||"",ten:r[3]||"",coquan:r[4]||"",nbh:r[5]||"",nhl:r[6]||"",
    tt:r[7]||"",xm:r[8]||"",dufile:r[9]||"",lv:r[10]||"",dp:r[11]||"",lct:r[12]||"",tk:r[13]||"",
    nkt:r[14]||"",folder:r[15]||"",dot:r[16]||"",gc:r[17]||""};
});
var byMa={}; VB.forEach(function(v){byMa[v.ma]=v;});
var filesByVB={};
(DATA.files||[]).forEach(function(f){
  var rec={ma:f[0]||"",hs:f[1]||"",ten:f[2]||"",role:f[3]||"",fmt:f[4]||"",pages:f[5]||"",size:f[6]||"",sha:f[7]||"",src:f[8]||"",dl:f[9]||"",drive:f[11]||"",note:f[13]||""};
  splitMulti(rec.hs).forEach(function(code){(filesByVB[code]=filesByVB[code]||[]).push(rec);});
});
var relOut={}, relIn={};
(DATA.qh||[]).forEach(function(q){
  var rec={ma:q[0]||"",from:q[1]||"",type:q[2]||"",to:q[3]||"",scope:q[4]||"",date:q[5]||"",xm:q[7]||""};
  (relOut[rec.from]=relOut[rec.from]||[]).push(rec);
  (relIn[rec.to]=relIn[rec.to]||[]).push(rec);
});
var dcByVB={};
(DATA.dc||[]).forEach(function(d){
  var rec={ma:d[0]||"",src:d[2]||"",url:d[3]||"",date:d[4]||"",fields:d[6]||"",res:d[7]||"",diff:d[8]||""};
  splitMulti(d[1]||"").forEach(function(code){(dcByVB[code]=dcByVB[code]||[]).push(rec);});
});
var cvByVB={};
(DATA.cv||[]).forEach(function(c){
  splitMulti(c[1]||"").forEach(function(code){(cvByVB[code]=cvByVB[code]||[]).push(c);});
});

/* ---- Status grouping ---- */
function statusGroup(v){
  var t=(v.tt||"").toLowerCase().trim();
  if(v.loai==="Dự thảo"||t.indexOf("dự thảo")===0) return {k:"duthao",label:"Dự thảo",cls:"draft"};
  if(t.indexOf("hết hiệu lực")>=0) return {k:"het",label:"Hết hiệu lực",cls:"bad"};
  if(t.indexOf("chưa có hiệu lực")>=0) return {k:"chua",label:"Chưa có hiệu lực",cls:"warn"};
  if(v.loai==="Văn bản hợp nhất"||t.indexOf("hợp nhất")===0||t.indexOf("bản hợp nhất")===0||t.indexOf("văn bản hợp nhất")===0) return {k:"hopnhat",label:"Văn bản hợp nhất",cls:"acc"};
  if(t.indexOf("bản lịch sử")===0) return {k:"lichsu",label:"Bản lịch sử",cls:"vio"};
  if(t.indexOf("còn hiệu lực")>=0||t.indexOf("có hiệu lực")===0) return {k:"con",label:"Còn hiệu lực",cls:"ok"};
  return {k:"rasoat",label:"Chưa xác định",cls:"grey"};
}
function statusChip(v,g){
  if(g.label===v.loai) return "";
  return '<span class="tag '+g.cls+'">'+esc(g.label)+"</span>";
}

/* ---- Highlight (diacritic-insensitive, NFC index mapping) ---- */
function highlight(text,tokens){
  text=String(text||"");
  if(!tokens||!tokens.length) return esc(text);
  var normStr="",map=[];
  for(var i=0;i<text.length;i++){
    var base=stripDia(text[i].toLowerCase());
    for(var j=0;j<base.length;j++){normStr+=base[j];map.push(i);}
  }
  var spans=[];
  tokens.forEach(function(tk){
    if(!tk)return; var idx=0;
    while(true){var p=normStr.indexOf(tk,idx);if(p<0)break;
      spans.push([map[p],map[p+tk.length-1]+1]); idx=p+tk.length;}
  });
  if(!spans.length) return esc(text);
  spans.sort(function(a,b){return a[0]-b[0];});
  var merged=[spans[0]];
  for(var k=1;k<spans.length;k++){var last=merged[merged.length-1];
    if(spans[k][0]<=last[1]) last[1]=Math.max(last[1],spans[k][1]); else merged.push(spans[k]);}
  var out="",pos=0;
  merged.forEach(function(sp){out+=esc(text.slice(pos,sp[0]))+"<mark>"+esc(text.slice(sp[0],sp[1]))+"</mark>";pos=sp[1];});
  out+=esc(text.slice(pos));
  return out;
}

/* ---- State ---- */
var state={q:"",lv:"",loai:"",coquan:"",status:"",sort:"rel",current:null};
var $=function(id){return document.getElementById(id);};

  ["search","update","lib"].forEach(function(n){$("panel-"+n).hidden=(n!==name);});
  window.scrollTo({top:0,behavior:"smooth"});
}
tabBtns.forEach(function(b){b.addEventListener("click",function(){showTab(b.getAttribute("data-tab"));});});

/* ---- Theme ---- */
var themeMode=null;
$("themeBtn").addEventListener("click",function(){
  var cur=document.documentElement.getAttribute("data-theme");
  var dark = cur==="dark" || (!cur && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme",dark?"light":"dark");
});

/* ---- Stats strip ---- */
(function(){
  var tk={}; (DATA.tk||[]).forEach(function(r){tk[r[0]]=r[1];});
  var totalHoSo=tk["Hồ sơ có định danh"]||VB.length;
  $("statsStrip").innerHTML='<div class="stat"><b>'+esc(totalHoSo)+'</b><span>hồ sơ văn bản</span></div>';
})();

/* ---- Filters setup ---- */
function distinctSorted(getter){
  var s={},out=[];
  VB.forEach(function(v){getter(v).forEach(function(x){if(!s[x]){s[x]=1;out.push(x);}});});
  return out;
}
var lvList=distinctSorted(function(v){return splitMulti(v.lv);});
lvList.sort(function(a,b){
  var ca=VB.filter(function(v){return splitMulti(v.lv).indexOf(a)>=0;}).length;
  var cb=VB.filter(function(v){return splitMulti(v.lv).indexOf(b)>=0;}).length;
  return cb-ca||a.localeCompare(b,"vi");
});
function fillSelect(id,allLabel,items){
  var el=$(id); if(!el)return;
  var html='<option value="">'+esc(allLabel)+"</option>";
  items.forEach(function(it){html+='<option value="'+esc(it.value)+'">'+esc(it.label)+"</option>";});
  el.innerHTML=html;
}
var loaiList=distinctSorted(function(v){return v.loai?[v.loai]:[];}).sort(function(a,b){return a.localeCompare(b,"vi");});
var coquanList=distinctSorted(function(v){return v.coquan?[v.coquan]:[];}).sort(function(a,b){return a.localeCompare(b,"vi");});
var STATUS_OPTS=[
  {value:"con",label:"Còn hiệu lực"},
  {value:"rasoat",label:"Chưa xác định"},
  {value:"chua",label:"Chưa có hiệu lực"},
  {value:"het",label:"Hết hiệu lực"},
  {value:"hopnhat",label:"Văn bản hợp nhất"},
  {value:"lichsu",label:"Bản lịch sử"},
  {value:"duthao",label:"Dự thảo tham khảo"}
];
function renderLvChips(){
  var el=$("lvChips"); if(!el)return;
  var html='<button type="button" class="chip" data-v="" aria-pressed="'+(state.lv===""?"true":"false")+'">Tất cả lĩnh vực</button>';
  lvList.forEach(function(lv){
    var n=VB.filter(function(v){return splitMulti(v.lv).indexOf(lv)>=0;}).length;
    html+='<button type="button" class="chip" data-v="'+esc(lv)+'" aria-pressed="'+(state.lv===lv?"true":"false")+'">'+esc(lv)+" ("+n+")</button>";
  });
  el.innerHTML=html;
  el.querySelectorAll("button").forEach(function(b){
    b.addEventListener("click",function(){state.lv=b.getAttribute("data-v");renderLvChips();runSearch();});
  });
}
function renderFilterSelects(){
  fillSelect("fLoai","Tất cả loại",loaiList.map(function(x){return {value:x,label:x};}));
  fillSelect("fCoquan","Tất cả cơ quan",coquanList.map(function(x){return {value:x,label:x};}));
  fillSelect("fStatus","Tất cả",STATUS_OPTS);
  $("fLoai").value=state.loai;
  $("fCoquan").value=state.coquan;
  $("fStatus").value=state.status;
  $("fSort").value=state.sort;
}

/* ---- Search ---- */
function escRe(s){return String(s||"").replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function squash(s){return String(s||"").replace(/[^a-z0-9]/g,"");}
function tokenLevel(hay,tk){
  if(!tk)return 0;
  var e=escRe(tk);
  if(new RegExp("(^|[^a-z0-9])"+e+"([^a-z0-9]|$)").test(hay))return 3;
  if(new RegExp("(^|[^a-z0-9])"+e).test(hay))return 2;
  if(hay.indexOf(tk)>=0)return 1;
  var sq=squash(hay),st=squash(tk);
  if(st&&sq.indexOf(st)>=0)return 1;
  return 0;
}
function tokenIn(hay,tk){return tokenLevel(hay,tk)>0;}
function scoreVB(v,tokens,fullQ){
  if(!tokens.length) return 0;
  var so=norm(v.so),ten=norm(v.ten),kw=norm(v.tk),meta=norm(v.loai+" "+v.coquan+" "+v.lv+" "+v.lct),note=norm(v.ten+" "+v.gc);
  var hay=norm(v.so+" "+v.ten+" "+v.tk+" "+v.loai+" "+v.coquan+" "+v.lv+" "+v.lct+" "+v.gc);
  var matched=0,levelSum=0;
  tokens.forEach(function(tk){var lv=tokenLevel(hay,tk);if(lv>0)matched++;levelSum+=lv;});
  v._matched=matched;v._level=levelSum;
  /* Tầng ưu tiên: khớp nguyên cụm từ khóa > khớp đủ từng từ > khớp một vài từ lẻ.
     Trong cùng một tầng, khớp nguyên từ (mức 3) > khớp đầu từ (mức 2) > khớp một phần trong từ (mức 1):
     ví dụ gõ "qc" vẫn tìm thấy "QCVN", nhưng văn bản chứa đúng từ khóa nguyên vẹn xếp trước. */
  var s=matched*500+levelSum*25;
  if(tokens.length>1&&fullQ){
    if(so.indexOf(fullQ)>=0) s+=1500;
    else if(ten.indexOf(fullQ)>=0) s+=1400;
    else if(hay.indexOf(fullQ)>=0) s+=1200;
  }
  if(fullQ&&so===fullQ) s+=200;
  if(fullQ&&so.indexOf(fullQ)>=0) s+=90;
  if(fullQ&&ten.indexOf(fullQ)>=0) s+=55;
  tokens.forEach(function(tk){
    if(so.indexOf(tk)>=0)s+=42;
    if(ten.indexOf(tk)>=0)s+=26;
    if(kw.indexOf(tk)>=0)s+=16;
    if(meta.indexOf(tk)>=0)s+=9;
    if(note.indexOf(tk)>=0)s+=3;
  });
  var g=statusGroup(v).k;
  if(g==="het"||g==="lichsu")s-=14;
  if(g==="duthao")s-=10;
  return s;
}
function currentTokens(){return state.q?norm(state.q).split(" ").filter(Boolean):[];}
function filteredVB(){
  var tokens=currentTokens(),fullQ=norm(state.q);
  var list=VB.filter(function(v){
    if(state.lv&&splitMulti(v.lv).indexOf(state.lv)<0)return false;
    if(state.loai&&v.loai!==state.loai)return false;
    if(state.coquan&&v.coquan!==state.coquan)return false;
    if(state.status&&statusGroup(v).k!==state.status)return false;
    if(tokens.length){
      var hay=norm(v.ma+" "+v.so+" "+v.ten+" "+v.coquan+" "+v.loai+" "+v.lv+" "+v.tk+" "+v.lct+" "+v.gc);
      var cnt=0,best=0;
      for(var i=0;i<tokens.length;i++){var lv=tokenLevel(hay,tokens[i]);if(lv>0)cnt++;if(lv>best)best=lv;}
      /* Một từ khóa: khớp một phần của từ là đủ (gõ "qc" ra QCVN).
         Nhiều từ khóa: cần ít nhất một từ khớp nguyên từ / đầu từ, hoặc khớp từ hai mảnh trở lên,
         để mảnh ngắn nằm tình cờ trong từ khác (ví dụ "an" trong "ban hành") không làm tràn kết quả. */
      var pass = tokens.length===1 ? cnt>0 : (best>=2||cnt>=2);
      if(!pass)return false;
    }
    return true;
  });
  list.forEach(function(v){v._s=scoreVB(v,tokens,fullQ);});
  if(state.sort==="new")list.sort(function(a,b){return (b.nbh||"").localeCompare(a.nbh||"");});
  else if(state.sort==="eff")list.sort(function(a,b){return (b.nhl||"").localeCompare(a.nhl||"");});
  else if(state.sort==="so")list.sort(function(a,b){return a.so.localeCompare(b.so,"vi");});
  else list.sort(function(a,b){return (b._matched||0)-(a._matched||0)||b._s-a._s||(b.nbh||"").localeCompare(a.nbh||"");});
  return list;
}
function resCard(v,tokens){
  var g=statusGroup(v);
  var nf=(filesByVB[v.ma]||[]).length;
  return '<button type="button" class="res" data-ma="'+esc(v.ma)+'" aria-current="'+(state.current===v.ma?"true":"false")+'">'
    +'<span class="meta"><span class="so">'+highlight(v.so,tokens)+'</span><span class="tag">'+esc(v.loai)+"</span>"+statusChip(v,g)
    +(nf?'<span class="tag acc">'+nf+" tệp</span>":"<span class=\"tag\">Chưa có tệp</span>")
    +"</span>"
    +'<span class="ten">'+highlight(v.ten,tokens)+"</span>"
    +'<span class="sub">'+esc(v.coquan)+" · Ban hành "+fmtDate(v.nbh)+(v.nhl?" · Hiệu lực "+fmtDate(v.nhl):"")+" · "+esc(v.lv)+"</span>"
    +"</button>";
}
function runSearch(){
  var list=filteredVB(),tokens=currentTokens();
  var MAX=80,shown=list.slice(0,MAX);
  $("resCount").textContent="Tìm thấy "+list.length+" hồ sơ"+(list.length>MAX?" — hiển thị "+MAX+" kết quả đầu, hãy thu hẹp từ khóa hoặc bộ lọc":"");
  $("results").innerHTML=list.length?shown.map(function(v){return resCard(v,tokens);}).join("")
    :'<div class="empty"><b>Không tìm thấy văn bản nào</b>Thử bỏ bớt từ khóa, kiểm tra số hiệu (ví dụ 06/2022/TT-BXD) hoặc xóa bộ lọc lĩnh vực / loại.</div>';

    b.addEventListener("click",function(){selectVB(b.getAttribute("data-ma"),true);});
  });

  else if(!list.length){$("detail").innerHTML='<div class="empty"><b>Chưa chọn văn bản</b>Kết quả tra cứu sẽ hiện chi tiết tại đây.</div>';state.current=null;$("detail").scrollTop=0;}
  else renderDetail();
}

function renderDetail(){
  var v=byMa[state.current]; if(!v)return;
  var g=statusGroup(v);
  var files=filesByVB[v.ma]||[];

    +"</dl>";
  h+='<div><dt style="font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">Tình trạng hiệu lực (ghi đầy đủ)</dt><p style="margin:3px 0 0">'+esc(v.tt)+"</p></div>";
  if(v.tk)h+='<p class="note" style="margin-top:8px">Từ khóa: '+esc(v.tk)+"</p>";
  var driveUrl=(files.length&&isUrl(files[0].drive))?files[0].drive:(isUrl(v.folder)?v.folder:"");
  var srcUrl=(files.length&&isUrl(files[0].src))?files[0].src:((dcs.length&&isUrl(dcs[0].url))?dcs[0].url:"");
  if(driveUrl||srcUrl){
    h+='<p style="display:flex;gap:8px;flex-wrap:wrap">'
      +(driveUrl?'<a class="btn" style="display:inline-block;text-decoration:none" href="'+esc(driveUrl)+'" target="_blank" rel="noopener">Mở trên Drive ↗</a>':"")
      +(srcUrl?'<a class="btn" style="display:inline-block;text-decoration:none" href="'+esc(srcUrl)+'" target="_blank" rel="noopener">Nguồn gốc ↗</a>':"")
      +"</p>";
  }

  

  var related=[];
  if(!outs.length&&!ins.length){
    var myLv=splitMulti(v.lv),myTok={};
    norm(v.ten+" "+v.tk).split(" ").forEach(function(t){if(t.length>=3)myTok[t]=1;});
    VB.forEach(function(o){
      if(o.ma===v.ma)return;
      if(!splitMulti(o.lv).some(function(x){return myLv.indexOf(x)>=0;}))return;
      var sc=0,seen={};
      norm(o.ten+" "+o.tk).split(" ").forEach(function(t){if(t.length>=3&&myTok[t]&&!seen[t]){seen[t]=1;sc++;}});
      related.push({o:o,sc:sc});
    });
    related.sort(function(a,b){return b.sc-a.sc||(b.o.nbh||"").localeCompare(a.o.nbh||"");});
    related=related.slice(0,5);
  }
  h+='<div class="dsec"><h3>Quan hệ với văn bản khác</h3>';
  if(outs.length||ins.length){
    outs.forEach(function(r){
      var t=byMa[r.to];
      h+='<button type="button" class="relrow" data-go="'+esc(r.to)+'"><span class="tag acc">'+esc(r.type)+'</span><span><span class="rt">'+esc(t?t.so+" — "+t.ten:r.to)+'</span><br><span class="rm">'+esc(r.scope)+(r.date?" · Từ "+fmtDate(r.date):"")+"</span></span></button>";
    });
    ins.forEach(function(r){
      var t=byMa[r.from];
      h+='<button type="button" class="relrow" data-go="'+esc(r.from)+'"><span class="tag vio">'+esc(r.type)+" văn bản này</span><span><span class=\"rt\">"+esc(t?t.so+" — "+t.ten:r.from)+'</span><br><span class="rm">'+esc(r.scope)+(r.date?" · Từ "+fmtDate(r.date):"")+"</span></span></button>";
    });
  } else if(related.length){
    h+='<p class="note" style="margin:0 0 4px">Chưa ghi quan hệ chính thức (thay thế, sửa đổi, hợp nhất…) cho văn bản này — văn bản liên quan cùng lĩnh vực:</p>';
    related.forEach(function(it){
      var o=it.o;
      h+='<button type="button" class="relrow" data-go="'+esc(o.ma)+'"><span class="tag">Cùng lĩnh vực</span><span><span class="rt">'+esc(o.so+" — "+o.ten)+'</span><br><span class="rm">'+esc(o.coquan)+" · Ban hành "+fmtDate(o.nbh)+"</span></span></button>";
    });
  } else {
    h+='<p class="note" style="margin:0">Chưa ghi quan hệ với văn bản khác.</p>';
  }
  h+="</div>";
  if(dcs.length){
    h+='<div class="dsec"><h3>Đối chiếu nguồn ('+dcs.length+")</h3>";
    dcs.forEach(function(d){
      h+='<div class="srcrow"><span style="flex:1;min-width:0"><b>'+esc(d.src)+'</b>'
        +"</span>"
        +(isUrl(d.url)?'<a href="'+esc(d.url)+'" target="_blank" rel="noopener" style="white-space:nowrap">Mở nguồn ↗</a>':"")
        +"</div>";
    });
    h+="</div>";
  }
  $("detail").innerHTML=h;
  $("detail").scrollTop=0;
  $("detail").querySelectorAll("[data-go]").forEach(function(b){
    b.addEventListener("click",function(){
      var target=b.getAttribute("data-go");
      if(!byMa[target])return;
      state.q="";$("q").value="";state.lv="";state.loai="";state.coquan="";state.status="";
      renderLvChips();renderFilterSelects();state.current=target;runSearch();selectVB(target,true);
    });
  });
}

/* ---- Cuộn riêng cho bảng nội dung văn bản ----
   Khung chi tiết trôi theo trang như cũ; chỉ khi khung đã chạm thanh header
   (dính ở vị trí sticky top:64px) thì lăn chuột trong khung mới cuộn nội dung bên trong. */
$("detail").addEventListener("wheel",function(e){
  if(window.innerWidth<=900)return;
  var el=$("detail");
  if(el.getBoundingClientRect().top>65){
    e.preventDefault();
    var d=e.deltaY;
    if(e.deltaMode===1)d*=16;
    else if(e.deltaMode===2)d*=window.innerHeight;
    window.scrollBy({top:d,left:0,behavior:"instant"});
  }
},{passive:false});

     tt:"Sửa đổi Luật Kiến trúc 2019. Bổ sung khái niệm bản sắc văn hóa trong kiến trúc, quy định lại nội dung thiết kế kiến trúc và phạm vi hành nghề kiến trúc, trong đó có kiến trúc cảnh quan.",
     dc:["Định nghĩa bản sắc văn hóa trong kiến trúc: tổ chức không gian, hình thức kiến trúc, kỹ thuật xây dựng và cảnh quan phản ánh lịch sử, phong tục, điều kiện tự nhiên.","Thiết kế kiến trúc phải tuân thủ pháp luật về quy hoạch đô thị và nông thôn, xét đến phòng cháy, môi trường, tiết kiệm năng lượng và tiếp cận bình đẳng.","Phạm vi hành nghề kiến trúc gồm thiết kế công trình, kiến trúc trong quy hoạch, kiến trúc cảnh quan, nội thất, thẩm tra thiết kế kiến trúc.","Các nguồn tin đề cập yêu cầu BIM cho thiết kế kiến trúc từ 01/3/2027, cần đối chiếu toàn văn."],

  var bySo={}; VB.forEach(function(v){if(v.so)bySo[v.so]=v;});
  function newsTarget(n){
    if(bySo[n.so])return bySo[n.so];
    var tac=n.tac||[];
    for(var i=0;i<tac.length;i++){if(bySo[tac[i]])return bySo[tac[i]];}
    if(n.khoTen){
      var f=norm(n.khoTen);
      for(var j=0;j<VB.length;j++){if(norm(VB[j].ten).indexOf(f)>=0)return VB[j];}
    }
    return null;
  }
  var newsType="",newsImp=false;
  var NEWS_TYPES=["Ban hành mới","Sửa đổi, bổ sung","Thay thế","Hợp nhất","Dự thảo"];
  function renderNewsChips(){
    var el=$("newsTypeChips"); if(!el)return;
    var html='<button type="button" class="chip" data-nt="" aria-pressed="'+(newsType===""?"true":"false")+'">Tất cả</button>';
    NEWS_TYPES.forEach(function(t){
      html+='<button type="button" class="chip" data-nt="'+esc(t)+'" aria-pressed="'+(newsType===t?"true":"false")+'">'+esc(t)+"</button>";
    });
    el.innerHTML=html;
    el.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click",function(){newsType=b.getAttribute("data-nt");renderNewsChips();renderNews();});
    });
    var imp=$("newsImpChip"); if(imp)imp.setAttribute("aria-pressed",newsImp?"true":"false");
  }
  function newsDateTs(s){
    if(!s)return null;
    s=String(s).trim();
    if(!s)return null;
    var m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s);
    if(m)return new Date(+m[3],+m[2]-1,+m[1]).getTime();
    var m2=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);
    if(m2)return new Date(+m2[1],+m2[2]-1,+m2[3]).getTime();
    var t=Date.parse(s);
    return isNaN(t)?null:t;
  }
  /* Lọc mô tả tin ở tầng render, theo từng câu: chỉ giữ phần tóm tắt nội
     dung liên quan đến chính văn bản; bỏ các câu (1) khuyên dùng / khuyến
     nghị dùng văn bản ở kho thư viện và (2) ghi chú nội bộ, trạng thái xác
     minh của người biên soạn tin. Câu nào chứa cả ý nội dung lẫn phần đuôi
     nội bộ tách thành câu riêng thì chỉ câu nội bộ bị bỏ, ý nội dung vẫn
     giữ nguyên. Nhờ lọc lúc hiển thị nên dữ liệu tin nạp lại hằng ngày từ
     file .md vẫn được áp dụng đúng quy tắc này mà không cần sửa tay dữ liệu. */
  function cleanNewsText(s){
    if(!s)return "";
    var drop=[
      /* Khuyên dùng / khuyến nghị dùng ở kho thư viện */
      /khuyên\s+dùng/i,
      /khuyến\s+nghị\s*:?\s*(dùng|sử\s+dụng|áp\s+dụng|tra\s+cứu|tham\s+khảo)/i,
      /nên\s+(dùng|sử\s+dụng|tra\s+cứu|tham\s+khảo|áp\s+dụng)/i,
      /ưu\s+tiên\s+(dùng|sử\s+dụng)/i,
      /(dùng|sử\s+dụng|tra\s+cứu|tham\s+khảo|lưu|nạp)\b[^.!?]*\b(ở|tại|trong|vào)\s+kho\b/i,
      /nạp\b[^.!?]*\bvào\s+kho/i,
      /kho\s+thư\s+viện/i,
      /* Ghi chú nội bộ / trạng thái xác minh, không phải nội dung văn bản */
      /chưa\s+xác\s+minh/i,
      /cần\s+xác\s+minh/i,
      /chưa\s+đọc\s+được/i,
      /cần\s+mở\s+trang/i,
      /lấy\s+theo\s+tên\s+file/i,
      /theo\s+tên\s+file\s+đăng/i,
      /link\s+toàn\s+văn\s+là/i,
      /^\s*cần\s+đối\s+chiếu/i,
      /cần\s+đối\s+chiếu\s+điều\s+khoản\s+thi\s+hành/i
    ];
    return String(s).split(/(?<=[.!?])\s+|\n+/)
      .map(function(p){return p.trim();})
      .filter(function(p){
        if(!p)return false;
        for(var i=0;i<drop.length;i++){if(drop[i].test(p))return false;}
        return true;
      })
      .join(" ").replace(/\s+/g," ").trim();
  }
  function renderNews(){
    var list=NEWS.filter(function(n){
      if(newsType&&n.lt!==newsType)return false;
      if(newsImp&&!n.qt)return false;
      return true;
    });
    list=list.map(function(n,i){return {n:n,i:i};}).sort(function(a,b){
      var qa=a.n.qt?1:0,qb=b.n.qt?1:0;
      if(qa!==qb)return qb-qa;
      var da=newsDateTs(a.n.nt),db=newsDateTs(b.n.nt);
      if(da==null&&db==null)return a.i-b.i;
      if(da==null)return 1;
      if(db==null)return -1;
      if(db!==da)return db-da;
      return a.i-b.i;
    }).map(function(x){return x.n;});
    $("newsList").innerHTML=list.map(function(n){
      var tgt=newsTarget(n);
      var meta=[];
      if(n.bh)meta.push("Ban hành "+n.bh);
      if(n.hl)meta.push("Hiệu lực từ "+n.hl);
      if(n.nt)meta.push("Tin ngày "+n.nt);
      var h='<article class="news-card'+(n.qt?" imp":"")+'">';
      h+='<div class="news-top">'
        +(n.qt?'<span class="news-imp">QUAN TRỌNG</span>':"")
        +'<span class="news-type">'+esc(n.lt)+'</span>'
        +'<span class="news-so">'+esc(n.so)+'</span><span>· '+esc(n.lvb)+' · '+esc(n.cq)+"</span></div>";
      h+="<h3>"+esc(n.ten)+"</h3>";
      if(meta.length)h+='<p class="news-meta">'+esc(meta.join(" · "))+"</p>";
      var sum=cleanNewsText(n.tt);
      if(sum)h+='<p class="news-sum">'+esc(sum)+"</p>";
      var pts=(n.dc||[]).map(cleanNewsText).filter(function(p){return p;});
      if(pts.length){
        h+='<details class="news-points"><summary>Điểm chính ('+pts.length+")</summary><ul>"
          +pts.map(function(p){return "<li>"+esc(p)+"</li>";}).join("")+"</ul></details>";
      }
      var note=cleanNewsText(n.gc);
      if(note)h+='<p class="news-note">'+esc(note)+"</p>";
      if(n.ng&&n.ng.length){
        h+='<p class="news-src">Nguồn: '+n.ng.map(function(s){
          return '<a href="'+esc(s[1])+'" target="_blank" rel="noopener">'+esc(s[0])+"</a>";
        }).join(" · ")+"</p>";
      }
      var acts="";
      if(tgt)acts+='<button type="button" class="btn" data-newsgo="'+esc(tgt.ma)+'">Mở trong kho</button>';
      if(n.tv)acts+='<a class="btn primary" href="'+esc(n.tv)+'" target="_blank" rel="noopener">Xem toàn văn</a>';
      if(acts)h+='<div class="news-actions">'+acts+"</div>";
      h+="</article>";
      return h;
    }).join("")||'<div class="empty"><b>Không có tin nào khớp bộ lọc</b>Thử chọn loại tin khác hoặc tắt lọc “Tin quan trọng”.</div>';
    $("newsList").querySelectorAll("[data-newsgo]").forEach(function(b){
      b.addEventListener("click",function(){gotoDetail(b.getAttribute("data-newsgo"));});
    });
  }
  $("newsImpChip").addEventListener("click",function(){newsImp=!newsImp;renderNewsChips();renderNews();});
  renderNewsChips();
  renderNews();

/* ---- Init ---- */
renderLvChips();
renderFilterSelects();
runSearch();
renderLib();
})();
</script>
